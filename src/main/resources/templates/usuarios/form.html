<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('CycleGo | Usuario', 'usuarios', ~{::section})}">

<section class="usuario-form">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="h5 mb-0" th:text="${titulo}">Usuario</h2>
                </div>

                <div class="card-body">

                    <form th:action="@{${urlForm}}" th:object="${usuario}" method="post">

                        <!-- CSRF -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />

                        <!-- Para saber si venimos en edición -->
                        <input type="hidden" name="modoEdicion" th:value="${modoEdicion}" />

                        <!-- ID oculto en edición -->
                        <input type="hidden" th:if="*{idUsuario} != null"
                               th:field="*{idUsuario}" />

                        <!-- USERNAME -->
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text"
                                id="username"
                                class="form-control"
                                th:field="*{username}"
                                required
                                minlength="4"
                                maxlength="50">
                            <div class="text-danger" th:if="${#fields.hasErrors('username')}"
                                th:errors="*{username}"></div>
                        </div>

                        <!-- PASSWORD -->
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password"
                                id="password"
                                class="form-control"
                                th:field="*{password}"
                                th:attr="required=${!modoEdicion}">
                            <div class="form-text" th:if="${modoEdicion}">
                                Deja este campo vacío si no deseas cambiar la contraseña.
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('password')}"
                                th:errors="*{password}"></div>
                        </div>

                        <!-- CONFIRMAR PASSWORD -->
                        <div class="mb-3">
                            <label for="passwordConfirm" class="form-label">Confirmar contraseña</label>
                            <input type="password"
                                id="passwordConfirm"
                                class="form-control"
                                th:field="*{passwordConfirm}"
                                th:attr="required=${!modoEdicion}">
                            <div class="text-danger" th:if="${#fields.hasErrors('passwordConfirm')}"
                                th:errors="*{passwordConfirm}"></div>
                        </div>

                        <!-- ROL -->
                        <div class="mb-3">
                            <label for="rol" class="form-label">Rol</label>
                            <select id="rol"
                                    class="form-select"
                                    th:field="*{rol}"
                                    required>
                                <option value="">-- Seleccione un rol --</option>
                                <option th:each="r : ${roles}"
                                        th:value="${r}"
                                        th:text="${r}">
                                </option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('rol')}"
                                th:errors="*{rol}"></div>
                        </div>

                        <!-- EMPLEADO en CREACIÓN: select -->
                        <div class="mb-3" th:if="${!modoEdicion}">
                            <label for="empleadoId" class="form-label">Empleado</label>
                            <select id="empleadoId"
                                    class="form-select"
                                    name="empleadoId"
                                    required>
                                <option value="">-- Seleccione un empleado --</option>
                                <option th:each="e : ${empleadosDisponibles}"
                                        th:value="${e.idEmpleado}"
                                        th:text="${e.nombres + ' ' + e.apellidos}">
                                </option>
                            </select>
                        </div>

                        <!-- EMPLEADO en EDICIÓN: solo lectura -->
                        <div class="mb-3" th:if="${modoEdicion}">
                            <label class="form-label">Empleado asignado</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="*{empleado != null} ? *{empleado.nombres + ' ' + empleado.apellidos} : 'Sin empleado'"
                                   readonly>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/usuarios}" class="btn btn-secondary">
                                Volver
                            </a>
                            <button type="submit" class="btn btn-primary">
                                Guardar
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
</section>

</html>
