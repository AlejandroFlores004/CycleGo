<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('CycleGo | Usuarios', 'usuarios', ~{::section})}">

<section class="usuarios-lista">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 fw-bold text-primary">
            Gestión de usuarios
        </h1>

        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">
            <i class="bi bi-plus-circle"></i> Nuevo usuario
        </a>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Username</th>
                            <th>Empleado</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="usuario, stat : ${usuarios}">
                            <td th:text="${stat.count}">1</td>
                            <td th:text="${usuario.username}">admin</td>
                            <td th:text="${usuario.empleado != null ? usuario.empleado.nombres : '—'}">
                                Empleado
                            </td>
                            <td th:text="${usuario.rol}">ADMIN</td>
                            <td>
                                <span th:if="${usuario.activo}" class="badge bg-success">Activo</span>
                                <span th:if="${!usuario.activo}" class="badge bg-danger">Inactivo</span>
                            </td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-primary me-1"
                                   th:href="@{'/usuarios/editar/' + ${usuario.idUsuario}}">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </a>
                                <a class="btn btn-sm btn-outline-danger"
                                   th:href="@{'/usuarios/eliminar/' + ${usuario.idUsuario}}"
                                   onclick="return confirm('¿Seguro que deseas eliminar este usuario?');">
                                    <i class="bi bi-trash"></i> Eliminar
                                </a>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <td colspan="6" class="text-center text-muted py-3">
                                No hay usuarios registrados.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</section>

</html>
