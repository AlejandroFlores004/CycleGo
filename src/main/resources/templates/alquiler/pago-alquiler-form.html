<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('CycleGo | Pago alquiler', 'alquileres', ~{::section})}">

<section class="pago-alquiler-form">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="h5 mb-0" th:text="${titulo}">Pago de alquiler</h2>
                </div>
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="card-body">
                    <!-- Info del alquiler -->
                    <div class="mb-3">
                        <h6 class="fw-bold">Información del alquiler</h6>
                        <p class="mb-1">
                            <strong>Cliente:</strong>
                            <span th:text="${alquiler.cliente.nombres + ' ' + alquiler.cliente.apellidos}"></span>
                        </p>
                        <p class="mb-1">
                            <strong>Bicicleta:</strong>
                            <span th:text="${alquiler.bicicleta.modelo}"></span>
                        </p>
                        <p class="mb-1">
                            <strong>Fecha alquiler:</strong>
                            <span th:text="${#dates.format(alquiler.fechaAlquiler, 'dd/MM/yyyy HH:mm')}"></span>
                        </p>
                    </div>

                    <form th:action="@{${urlForm}}" th:object="${pago}" method="post">

                        <!-- CSRF -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <!-- ID oculto -->
                        <input type="hidden" th:field="*{idPagoAlquiler}"/>

                        <!-- El alquiler se setea en el controlador -->
                        <input type="hidden" th:field="*{alquiler.idAlquiler}" th:value="${alquiler.idAlquiler}"/>

                        <!-- Monto total -->
                        <div class="mb-3">
                            <label for="montoTotal" class="form-label">Monto total</label>
                            <input type="number"
                                   step="0.01"
                                   id="montoTotal"
                                   class="form-control"
                                   th:field="*{montoTotal}" />
                            <div class="text-danger" th:if="${#fields.hasErrors('montoTotal')}"
                                 th:errors="*{montoTotal}"></div>
                        </div>

                        <!-- Método de pago -->
                        <div class="mb-3">
                            <label for="metodoPago" class="form-label">Método de pago</label>
                            <select id="metodoPago" class="form-select" th:field="*{metodoPago}">
                                <option value="">-- Seleccione un método --</option>
                                <option th:each="m : ${metodosPago}"
                                        th:value="${m}"
                                        th:text="${m}"></option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('metodoPago')}"
                                 th:errors="*{metodoPago}"></div>
                        </div>

                        <!-- Referencia -->
                        <div class="mb-3">
                            <label for="referencia" class="form-label">Referencia (opcional)</label>
                            <input type="text"
                                   id="referencia"
                                   class="form-control"
                                   th:field="*{referencia}" />
                            <div class="text-danger" th:if="${#fields.hasErrors('referencia')}"
                                 th:errors="*{referencia}"></div>
                        </div>

                        <!-- Observaciones -->
                        <div class="mb-3">
                            <label for="observaciones" class="form-label">Observaciones</label>
                            <textarea id="observaciones"
                                      class="form-control"
                                      rows="3"
                                      th:field="*{observaciones}"></textarea>
                            <div class="text-danger" th:if="${#fields.hasErrors('observaciones')}"
                                 th:errors="*{observaciones}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a class="btn btn-secondary" th:href="@{/alquileres}">
                                <i class="bi bi-arrow-left"></i> Volver
                            </a>

                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-cash-stack"></i> Guardar pago
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</html>
