<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('CycleGo | Bicicleta', 'bicicletas', ~{::section})}">

<section class="bicicleta-form">

    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="h5 mb-0" th:text="${titulo}">Formulario Bicicleta</h2>
                </div>

                <div class="card-body">

                    <form th:action="@{/bicicletas/guardar}"
                          th:object="${bicicleta}"
                          method="post">

                        <!-- CSRF -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <!-- ERRORES GENERALES -->
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                            <ul class="mb-0">
                                <li th:each="err : ${#fields.errors('*')}"
                                    th:text="${err}"></li>
                            </ul>
                        </div>

                        <!-- ID oculto -->
                        <input type="hidden" th:field="*{idBicicleta}"/>

                        <!-- Código -->
                        <div class="mb-3">
                            <label class="form-label">Código</label>
                            <input type="text"
                                   th:field="*{codigo}"
                                   class="form-control"
                                   required>
                        </div>

                        <!-- Descripción -->
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea th:field="*{descripcion}"
                                      class="form-control"
                                      rows="2"></textarea>
                        </div>

                        <!-- Marca -->
                        <div class="mb-3">
                            <label class="form-label">Marca</label>
                            <input type="text"
                                   th:field="*{marca}"
                                   class="form-control"
                                   required>
                        </div>

                        <!-- Modelo -->
                        <div class="mb-3">
                            <label class="form-label">Modelo</label>
                            <input type="text"
                                   th:field="*{modelo}"
                                   class="form-control"
                                   required>
                        </div>

                        <!-- Estado -->
                        <div class="mb-3">
                            <label class="form-label">Estado</label>
                            <select th:field="*{estado}" class="form-select" required>
                                <option value="" disabled
                                        th:selected="*{estado} == null">
                                    -- Seleccione --
                                </option>
                                <option th:each="estado : ${estados}"
                                        th:value="${estado}"
                                        th:text="${estado}">
                                </option>
                            </select>
                        </div>

                        <!-- Usuario que registra -->
                        <div class="mb-3">
                            <label class="form-label">Registrada por</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${usuarioRegistroNombre}"
                                   readonly>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/bicicletas}" class="btn btn-secondary">
                                Regresar
                            </a>
                            <button type="submit" class="btn btn-light border">
                                Guardar
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</section>

</html>
