<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('CycleGo | Empleados', 'empleados', ~{::section})}">

<section class="empleados-lista">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 fw-bold text-primary">
            Gestión de Empleados
        </h1>

        <a class="btn btn-primary" th:href="@{/empleados/nuevo}">
            <i class="bi bi-plus-circle"></i> Nuevo Empleado
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nombre Completo</th>
                            <th>DUI</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>Estado</th>
                            <th>Dirección</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="empleado, stat : ${empleados}">
                            <td th:text="${stat.count}">1</td>
                            <td th:text="${empleado.nombres + ' ' + empleado.apellidos}">Nombre del Empleado</td>
                            <td th:text="${empleado.dui}">00000000-0</td>
                            <td th:text="${empleado.telefono}">1234-5678</td>
                            <td th:text="${empleado.email}">correo@example.com</td>
                            <td>
                                <span th:if="${empleado.estado}" class="badge bg-success">Activo</span>
                                <span th:if="${!empleado.estado}" class="badge bg-danger">Inactivo</span>
                            </td>
                            <td th:text="${empleado.direccion}">Dirección del Empleado</td>

                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-primary me-1"
                                   th:href="@{'/empleados/editar/' + ${empleado.idEmpleado}}">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </a>
                                <a class="btn btn-sm btn-outline-danger"
                                   th:href="@{'/empleados/eliminar/' + ${empleado.idEmpleado}}"
                                   onclick="return confirm('¿Seguro que deseas eliminar a este empleado?');">
                                    <i class="bi bi-trash"></i> Eliminar
                                </a>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(empleados)}">
                            <td colspan="8" class="text-center text-muted py-3">
                                No hay empleados registrados.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</section>

</html>
