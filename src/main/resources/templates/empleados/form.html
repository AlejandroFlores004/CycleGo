<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('CycleGo | Empleado', 'empleados', ~{::section})}">

<section class="empleado-form">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="h5 mb-0" th:text="${titulo}">Empleado</h2>
                </div>

                <div class="card-body">

                    <form th:action="@{${urlForm}}" th:object="${empleado}" method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />

                        <input type="hidden" name="modoEdicion" th:value="${modoEdicion}" />

                        <input type="hidden" th:if="*{idEmpleado} != null"
                               th:field="*{idEmpleado}" />
                        
                        <input type="hidden" th:field="*{estado}" />


                        <div class="mb-3">
                            <label for="nombres" class="form-label">Nombres</label>
                            <input type="text"
                                id="nombres"
                                class="form-control"
                                th:field="*{nombres}"
                                required
                                maxlength="100">
                            <div class="text-danger" th:if="${#fields.hasErrors('nombres')}"
                                th:errors="*{nombres}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="apellidos" class="form-label">Apellidos</label>
                            <input type="text"
                                id="apellidos"
                                class="form-control"
                                th:field="*{apellidos}"
                                required
                                maxlength="100">
                            <div class="text-danger" th:if="${#fields.hasErrors('apellidos')}"
                                th:errors="*{apellidos}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="dui" class="form-label">DUI (12345678-9)</label>
                            <input type="text"
                                id="dui"
                                class="form-control"
                                th:field="*{dui}"
                                required
                                maxlength="10">
                            <div class="text-danger" th:if="${#fields.hasErrors('dui')}"
                                th:errors="*{dui}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="text"
                                id="telefono"
                                class="form-control"
                                th:field="*{telefono}"
                                required
                                maxlength="8">
                            <div class="text-danger" th:if="${#fields.hasErrors('telefono')}"
                                th:errors="*{telefono}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email"
                                id="email"
                                class="form-control"
                                th:field="*{email}"
                                required
                                maxlength="120">
                            <div class="text-danger" th:if="${#fields.hasErrors('email')}"
                                th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="direccion" class="form-label">Dirección</label>
                            <textarea
                                id="direccion"
                                class="form-control"
                                th:field="*{direccion}"
                                rows="3"
                                required
                                maxlength="200"></textarea>
                            <div class="text-danger" th:if="${#fields.hasErrors('direccion')}"
                                th:errors="*{direccion}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/empleados}" class="btn btn-secondary">
                                Volver
                            </a>
                            <button type="submit" class="btn btn-primary">
                                Guardar
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
</section>

</html>
