<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('CycleGo | Reportes', 'reportes', ~{::section})}">

<section class="dashboard">

    <!-- TÍTULO -->
    <div class="welcome-box shadow-sm p-4 mb-4 rounded-3">
        <h1 class="mb-1 fw-bold text-primary">
            Centro de Reportes
        </h1>
        <p class="lead text-muted mb-0">
            Selecciona el reporte que deseas generar.
        </p>
    </div>

    <!-- TARJETAS DE REPORTES -->
    <div class="row g-4">

        <!-- Reporte Alquileres -->
         <div class="col-md-4">
            <a th:href="@{/reportes/alquileres/pdf}"
            class="text-decoration-none">
                <div class="summary-card shadow-sm p-4 rounded-3 text-center report-card-hover">
                    <i class="bi bi-receipt fs-1 text-primary"></i>
                    <h4 class="mt-3 fw-bold text-dark">Reporte de Alquileres</h4>
                    <p class="text-muted small">Estado de alquileres, ingresos, devoluciones.</p>
                </div>
            </a>
        </div>

        <!-- Reporte Bicicletas -->
        <div class="col-md-4">
            <a th:href="@{/reportes/bicicletas/pdf}"
            class="text-decoration-none">
                <div class="summary-card shadow-sm p-4 rounded-3 text-center report-card-hover">
                    <i class="bi bi-bicycle fs-1 text-primary"></i>
                    <h4 class="mt-3 fw-bold text-dark">Reporte de Bicicletas</h4>
                    <p class="text-muted small">Disponibilidad, mantenimiento, estado general.</p>
                </div>
            </a>
        </div>

        <!-- Reporte Clientes -->
        <div class="col-md-4">
            <a th:href="@{/reportes/clientes}"
               class="text-decoration-none">
                <div class="summary-card shadow-sm p-4 rounded-3 text-center report-card-hover">
                    <i class="bi bi-people fs-1 text-primary"></i>
                    <h4 class="mt-3 fw-bold text-dark">Reporte de Clientes</h4>
                    <p class="text-muted small">Cantidad de clientes, historial y actividad.</p>
                </div>
            </a>
        </div>

    </div>

</section>

<!-- Estilos pequeños -->
<style>
    .report-card-hover {
        transition: 0.3s ease-in-out;
    }
    .report-card-hover:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.20);
    }
</style>

</html>
