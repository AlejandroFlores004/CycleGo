<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav class="navbar navbar-expand-lg main-navbar shadow-sm" th:fragment="menu(activePage)">
    <div class="container-fluid">

        <!-- Brand -->
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <span class="brand-icon me-2">
                <i class="bi bi-bicycle"></i>
            </span>
            <span class="brand-text">CycleGo</span>
        </a>

        <!-- Toggle -->
        <button class="navbar-toggler custom-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Items -->
        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto main-menu">

                <!-- Inicio -->
                <li class="nav-item"
                    th:classappend="${activePage == 'inicio'} ? ' active-nav'">
                    <a class="nav-link" th:href="@{/}">Inicio</a>
                </li>

                <!-- Grupo: Operaciones -->
                <li class="nav-item dropdown"
                    th:classappend="${activePage == 'bicicletas'
                                     or activePage == 'alquileres'
                                     or activePage == 'mantenimiento'} ? ' active-nav'">
                    <a class="nav-link dropdown-toggle" href="#"
                       id="operacionesDropdown"
                       role="button" data-bs-toggle="dropdown">
                        Operaciones
                    </a>

                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" th:href="@{/bicicletas}">Bicicletas</a></li>
                        <li><a class="dropdown-item" th:href="@{/alquileres}">Alquileres</a></li>
                        <li><a class="dropdown-item" th:href="@{/mantenimientos}">Mantenimiento</a></li>
                    </ul>
                </li>

                <!-- Grupo: Personas -->
                <li class="nav-item dropdown"
                    th:classappend="${activePage == 'empleados'
                                     or activePage == 'usuarios'
                                     or activePage == 'clientes'} ? ' active-nav'">
                    <a class="nav-link dropdown-toggle" href="#"
                       id="personasDropdown"
                       role="button" data-bs-toggle="dropdown">
                        Personas
                    </a>

                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" th:href="@{/empleados}">Empleados</a></li>
                        <li><a class="dropdown-item" th:href="@{/usuarios}">Usuarios</a></li>
                        <li><a class="dropdown-item" th:href="@{/clientes}">Clientes</a></li>
                    </ul>
                </li>

                <!-- Grupo: Reportes -->
                <li class="nav-item dropdown"
                    th:classappend="${activePage == 'reportes'} ? ' active-nav'">
                    <a class="nav-link dropdown-toggle" href="#"
                       id="reportesDropdown"
                       role="button" data-bs-toggle="dropdown">
                        Reportes
                    </a>

                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" th:href="@{/reportes/alquileres}">Alquileres</a></li>
                        <li><a class="dropdown-item" th:href="@{/reportes/bicicletas}">Bicicletas</a></li>
                        <li><a class="dropdown-item" th:href="@{/reportes/clientes}">Clientes</a></li>
                    </ul>
                </li>

            </ul>

            <!-- Área derecha -->
            <ul class="navbar-nav right-menu">
                <li class="nav-item d-flex align-items-center me-2" th:if="${usuarioSesion != null}">
                    <span class="nav-link disabled small">
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="${usuarioSesion.empleado.nombres}">Nombre</span>
                        (<span th:text="${usuarioSesion.username}">user</span>)
                    </span>
                </li>

                <li class="nav-item">
                    <a class="nav-link btn-logout" th:href="@{/logout}">
                        <i class="bi bi-box-arrow-right me-1"></i> Salir
                    </a>
                </li>
            </ul>


        </div>
    </div>
</nav>

</body>
</html>
