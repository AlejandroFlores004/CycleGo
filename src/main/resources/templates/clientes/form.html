<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('CycleGo | Cliente', 'clientes', ~{::section})}">

<section class="cliente-form">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="h5 mb-0" th:text="${titulo}">Cliente</h2>
                </div>

                <div class="card-body">

                    <form th:action="@{${urlForm}}" th:object="${cliente}" method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />

                        <input type="hidden" name="modoEdicion" th:value="${modoEdicion}" />

                        <input type="hidden" th:if="*{idCliente} != null"
                               th:field="*{idCliente}" />
                        
                        <input type="hidden" th:field="*{estado}" />

                        <div class="mb-3">
                            <label for="nombres" class="form-label">Nombres</label>
                            <input type="text"
                                id="nombres"
                                class="form-control"
                                th:field="*{nombres}"
                                required
                                maxlength="100">
                            <div class="text-danger" th:if="${#fields.hasErrors('nombres')}"
                                th:errors="*{nombres}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="apellidos" class="form-label">Apellidos</label>
                            <input type="text"
                                id="apellidos"
                                class="form-control"
                                th:field="*{apellidos}"
                                required
                                maxlength="100">
                            <div class="text-danger" th:if="${#fields.hasErrors('apellidos')}"
                                th:errors="*{apellidos}">
                            </div> 
                        </div>
                        <div class="mb-3">
                            <label for="dui" class="form-label">DUI (12345678-9)</label>
                            <input type="text"
                                id="dui"
                                class="form-control"
                                th:field="*{dui}"
                                required
                                maxlength="10">
                            <div class="text-danger" th:if="${#fields.hasErrors('dui')}"
                                th:errors="*{dui}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono (1234-5678)</label>
                            <input type="text"
                                id="telefono"
                                class="form-control"
                                th:field="*{telefono}"
                                required
                                maxlength="9">
                            <div class="text-danger" th:if="${#fields.hasErrors('telefono')}"
                                th:errors="*{telefono}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email"
                                id="email"
                                class="form-control"
                                th:field="*{email}"
                                required
                                maxlength="100">
                            <div class="text-danger" th:if="${#fields.hasErrors('email')}"
                                th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="fregistro" class="form-label">Fecha de registro</label>
                            <input
                                type="date"
                                id="fregistro"
                                class="form-control"
                                th:field="*{fregistro}"
                                required>
                            <div class="text-danger" th:if="${#fields.hasErrors('fregistro')}"
                                th:errors="*{fregistro}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="idUsuario" class="form-label">Usuario</label>
                            <select
                                id="idUsuario"
                                class="form-control"
                                th:field="*{idUsuario}"
                                required>
                                <option value="">Seleccionar usuario</option>
                                <option th:each="usuario : ${usuarios}" 
                                        th:value="${usuario.idUsuario}" 
                                        th:text="${usuario.nombres}">
                                </option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('idUsuario')}"
                                th:errors="*{idUsuario}"></div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input
                                    type="checkbox"
                                    id="estado"
                                    class="form-check-input"
                                    th:field="*{estado}">
                                <label for="estado" class="form-check-label">Estado</label>
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('estado')}"
                                th:errors="*{estado}"></div>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/clientes}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Volver
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save2"></i> Guardar
                            </button>
                     </div>
                    </form> 
                </div>
            </div>
        </div>
    </div> 
</section>
</html>
