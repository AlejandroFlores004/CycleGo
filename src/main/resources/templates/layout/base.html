<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, activePage, content)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} ?: 'CycleGo'">CycleGo</title>

    <!-- Bootstrap y CSS global -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Bootstrap Icons (para bi bi-bicycle, bi bi-box-arrow-right, etc.) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
    <!-- Tu CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/menu.css}">
</head>
<body>

    <!-- Menú reutilizable -->
    <nav th:replace="fragments/menu :: menu(${activePage})"></nav>

    <!-- Contenedor principal de cada pantalla -->
    <main class="container mt-4">
        <!-- Aquí entra el “block” de cada vista hija -->
        <div th:insert="${content}"></div>
    </main>

    <!-- JS global -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
