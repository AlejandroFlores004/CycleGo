services:
  postgres-db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_DB: cyclego_db
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demopass
    ports:
      - "5433:5432"      # Postgres accesible en localhost:5433
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - spring-net

  app:
    build: .
    container_name: spring-war-app
    depends_on:
      - postgres-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/cyclego_db
      SPRING_DATASOURCE_USERNAME: demo_user
      SPRING_DATASOURCE_PASSWORD: demopass
    ports:
      - "8080:8080"
    networks:
      - spring-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadminCycleGo
    depends_on:
      - postgres-db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: adminpass
    ports:
      - "8081:80"      # pgAdmin en localhost:8081
    networks:
      - spring-net

volumes:
  pg_data:

networks:
  spring-net:
